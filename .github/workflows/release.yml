name: Release the vault

# A new Texere version in the vault (.obsidian/plugins/texere/manifest.json), pushed to main: GitHub prepares a draft release
# "Texere vault <version>" with the whole vault as a zip, a snapshot in time. The owner only clicks "Publish" on the Releases page.
on:
  push:
    branches: [main]
    paths: [.obsidian/plugins/texere/manifest.json, .github/workflows/release.yml, ".github/release-notes/**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="$(node -p "require('./.obsidian/plugins/texere/manifest.json').version")"
          if gh release view "$v" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then echo "Release $v is already published."; exit 0; fi
          # the vault as people download it: one folder, named after the version (only what the repository publishes)
          zip="Texere-vault-$v.zip"
          git archive --format=zip --prefix="Texere – The Researcher's Vault/" -o "$zip" HEAD -- . ':!.github'
          notes=".github/release-notes/$v.md"; [ -f "$notes" ] || { notes="$RUNNER_TEMP/notes.md"; echo "Texere vault $v." > "$notes"; }
          if gh release view "$v" >/dev/null 2>&1; then
            gh release upload "$v" "$zip" --clobber
            gh release edit "$v" --notes-file "$notes" --target "$GITHUB_SHA"
          else
            gh release create "$v" --draft --title "Texere vault $v" --target "$GITHUB_SHA" --notes-file "$notes" "$zip"
          fi
